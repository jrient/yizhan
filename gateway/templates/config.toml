# 驿站实例配置。权限 0600 —— 里面有应用密钥。
app_id = "cli_填这里"
app_secret = "填这里"
project_dir = "{project_dir}"
skill = "{skill}"

# 告警收件人(机器人私聊你);进群、探活失败、卡 stuck 都发这里
alert_open_id = "ou_填你的open_id"
# 私聊白名单:只有这些人的私聊会被处理,其他只记录不回
p2p_allow = []
# 群白名单:显式列出。进了新群会私聊告警,确认后手工加进来再重启 listener
group_allow = []

quiet_seconds = 30        # 发起人最后一条消息静默多久才派单(同一人连发多条只回一次)
lock_minutes = 25
max_redispatch = 3
merge_gap_minutes = 10
idle_timeout_min = 15     # stream 无输出多久判卡死
hard_timeout_min = 60
# 注意:--dangerously-skip-permissions 会**连 settings.json 的 deny 清单一起绕过**。
# 群消息是不可信输入,这个值只适合关起门来跑通第一天;跑通后立刻换成下面这行,
# 让工作台 .claude/settings.json 的 allow/deny 真正生效:
#   permission_args = ["--permission-mode", "dontAsk", "--permission-prompts", "none"]
permission_args = ["--dangerously-skip-permissions"]
rotate_at_tokens = 0      # >0 时上下文超过这么多 token 就主动换新会话(兜底,默认依赖自动压缩)
compact_at_tokens = 300000  # 每小时 compact 只在上下文超过这么多 token 时才压;0 = 每次都压

# 工作时段(北京时间)。默认 06:00-24:00,可跨午夜如 "22:00-06:00",写 "" 表示全天。
# 时段外照常收消息建卡,只是不派单;到点不打断正在处理的卡。
# work_hours = "06:00-24:00"

# 回复是否开话题。true:追问天然并进同一张卡;false:平铺回复,靠(会话,发起人)+10 分钟窗口归并
reply_in_thread = true

# 给 claude 子进程补的环境变量。本机代理 http://127.0.0.1:7890 已是默认值(不给就 403),
# 这里不用写;要换代理就写同名键覆盖,写成 "" 就是不要这个变量。
[claude_env]
# https_proxy = "http://127.0.0.1:7890"
# http_proxy = "http://127.0.0.1:7890"
