<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - 驿站控制台</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body class="ui login-page">
<div class="login-wrapper">
  <div class="ui-card" style="width: 320px; max-width: 100%;">
    <h1 style="font-size: 20px; margin: 0 0 16px; text-align: center;">驿站控制台</h1>
    {% if error %}
    <div class="ui-alert danger" style="margin-bottom: 16px;">
      <span class="ico">⚠</span>
      <div class="desc">{{ error }}</div>
    </div>
    {% endif %}
    <form method="POST" action="/login" style="display: grid; gap: 16px;">
      <div style="display: grid; gap: 6px;">
        <label style="font-size: 12px; color: var(--text-2);">口令</label>
        <input class="ui-input" type="password" name="password" placeholder="输入访问口令" required autofocus>
      </div>
      <button class="ui-btn primary" style="justify-content: center;">登录</button>
    </form>
  </div>
</div>
</body>
</html>
