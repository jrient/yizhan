[project]
name = "yizhan"
version = "0.1.0"
description = "驿站:飞书 → Claude Code 网关"
requires-python = ">=3.12"
dependencies = ["lark-oapi>=1.4", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sse-starlette>=2",
  "itsdangerous>=2",
]

[project.scripts]
yizhan = "gateway.cli:main"
fgctl = "gateway.fgctl:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gateway", "gateway.web"]
include-package-data = true

[tool.setuptools.package-data]
gateway = ["templates/**/*", "templates/**/.claude/**/*"]
"gateway.web" = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
